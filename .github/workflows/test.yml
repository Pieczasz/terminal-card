name: Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: go test ./... -race -short -count=1

  integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run integration tests
      run: go test ./... -race -tags=integration -count=1 -timeout 15m

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: false

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.12.2

  vulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    # Reachability-based, so it fails only on advisories our call graph can actually
    # reach. Clean today; this is what keeps it clean.
    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
