version: "2"

run:
  tests: true
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - modernize
    - revive
    - godot
    - misspell
    - gomoddirectives
    - goprintffuncname
    - noctx
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - wrapcheck
    # Size and shape gates. Thresholds sit just above the worst function that
    # survived review, so they block regressions without failing on today's code.
    # Tighten them when the outliers below get split, not before.
    - cyclop
    - funlen
    - gocognit
    - nestif
    - lll
    - prealloc

  exclusions:
    generated: lax
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      # Table-driven tests are legitimately long and repetitive, and a test's
      # branchiness is not a maintenance signal the way production code's is.
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
          - nestif
          - lll
          - prealloc
          - wrapcheck
          - errcheck
          - noctx

  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    cyclop:
      # lobby view handleKey is 21: a flat key dispatch, branchy but not complex.
      max-complexity: 21
    funlen:
      # game.Engine.RemovePlayer is 71 lines; cmd/server run is 53 statements.
      lines: 75
      statements: 55
    gocognit:
      min-complexity: 30
    nestif:
      # poker buildSidePots orphan-chip handling is 8.
      min-complexity: 9
    lll:
      # A handful of repository method signatures sit at 121-134; wrapping those
      # reads worse than leaving them.
      line-length: 140

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
