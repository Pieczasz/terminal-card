version: "2"

run:
  tests: true
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unparam
    - modernize
    - revive
    - godot
    - misspell
    - gomoddirectives
    - goprintffuncname
    - noctx
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - wrapcheck
    - cyclop
    - funlen
    - gocognit
    - nestif
    - lll
    - prealloc
    - testifylint
    - thelper
    - paralleltest
    - tparallel
    - usetesting

  exclusions:
    generated: lax
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      # Table-driven tests are legitimately long and repetitive, and a test's
      # branchiness is not a maintenance signal the way production code's is.
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
          - nestif
          - lll
          - prealloc
          - wrapcheck
          - errcheck
          - noctx

  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    cyclop:
      # lobby view handleKey is 21: a flat key dispatch, branchy but not complex.
      max-complexity: 21
    funlen:
      lines: 75
      statements: 55
    gocognit:
      min-complexity: 30
    nestif:
      min-complexity: 9
    lll:
      line-length: 140

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
