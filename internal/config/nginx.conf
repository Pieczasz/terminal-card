# One worker per core: nginx defaults to a single worker, which with 1024
# connections and two per proxied SSH session capped the server at ~500 players
# while the backend advertises MAX_CONNECTIONS=1000.
worker_processes auto;

events {
    # Each proxied SSH session holds two connections (client side + backend side),
    # so this must be at least 2x the backend's MAX_CONNECTIONS per worker.
    worker_connections 4096;
}

stream {
    # Limit concurrent SSH connections per real client IP at the edge.
    # Backend RateLimitMiddleware still applies when clients bypass this proxy.
    limit_conn_zone $binary_remote_addr zone=ssh_addr:10m;

    server {
        listen 22 so_keepalive=on;
        limit_conn ssh_addr 8;
        proxy_pass backend:6969;
        # Forward the real client IP so the backend's per-IP rate limiter,
        # logs, and traces see the client, not this proxy.
        proxy_protocol on;
        # proxy_timeout covers the SSH session lifetime. SSH connections are
        # long-lived (card games), so 1 h is intentional and correct for the
        # session data timeout.  proxy_connect_timeout is the initial TCP
        # handshake to the backend only; a long value holds worker slots open
        # on backend outage, so keep it tight.
        proxy_timeout 1h;
        proxy_connect_timeout 10s;
    }
}

http {
    # This file replaces nginx's default conf wholesale, so the mime map it normally
    # provides has to be included by hand. Without it every static file is served as
    # application/octet-stream and browsers refuse to apply the stylesheet.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;

    # Security note: nginx speaks to the backend over plain loopback TCP (no TLS).
    # This is acceptable as long as both run on the same host inside the same Docker
    # network. If the backend is ever moved to a separate host or container network
    # segment reachable over a shared fabric, add a TLS terminator (e.g. mTLS with
    # Envoy, or stunnel) between nginx and the backend before that migration.

    # Public read-only stats feed for the website. Nothing here is authenticated and
    # nothing accepts writes, so the only thing worth defending is the cost of a
    # flood - hence the per-IP request zone below, on top of the backend's own limit.
    limit_req_zone $binary_remote_addr zone=api_addr:10m rate=2r/s;

    server_tokens off;

    # The apex keeps ssh (port 22, above) and the JSON API. The website itself lives
    # on www, served by GitHub Pages behind Cloudflare - the apex cannot be proxied by
    # Cloudflare because a proxied hostname resolves to Cloudflare's IPs and `ssh
    # tty.cards` would follow it there.
    #
    # TLS is still not terminated here. It has to be before launch: the site fetches
    # https://tty.cards/api, and a page served over https cannot call a plaintext
    # origin. Until then LiveStats shows "server unreachable", which is honest.
    # Uncomment the 443 server below once certificates are mounted.
    server {
        listen 80;
        server_name tty.cards;

        # /healthz pings the database on every request and exists for the container
        # healthcheck, which reaches it on loopback inside the compose network. The
        # proxy passes /api/ through wholesale, so it has to be shut out by name or
        # any caller can spend a database round-trip per request.
        location = /api/healthz {
            return 404;
        }

        location /api/ {
            limit_req zone=api_addr burst=10 nodelay;

            # The trailing slash on proxy_pass strips /api, so the backend keeps
            # serving its own /v1/... paths.
            proxy_pass http://backend:6970/;

            # API_TRUST_PROXY reads the leftmost entry of this header for its rate
            # limit, so it has to be set here and must not be forwarded from the
            # client. $remote_addr, not $proxy_add_x_forwarded_for: appending would
            # let a caller inject a leading address and take over the bucket.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_http_version 1.1;

            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # Everything that is not the API belongs to the website, which is on www.
        # 301 rather than serving a second copy from /srv/site: two origins for the
        # same pages means they drift, and search engines see duplicates.
        location / {
            return 301 https://www.tty.cards$request_uri;
        }
    }

    # Uncomment once certificates for tty.cards are mounted into this container.
    # Two ways to get them, both free:
    #
    #   certbot  - a certbot service in compose sharing a volume with this one, or
    #              certbot on the host with /etc/letsencrypt bind-mounted in.
    #   Cloudflare Origin CA - a 15-year certificate from the Cloudflare dashboard.
    #              Only trusted by Cloudflare, so it works for a proxied hostname but
    #              NOT for the grey-clouded apex, which browsers reach directly.
    #
    # The apex is grey-clouded, so it needs a publicly trusted certificate: certbot.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name tty.cards;
    #
    #     ssl_certificate     /etc/letsencrypt/live/tty.cards/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/tty.cards/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #
    #     location = /api/healthz {
    #         return 404;
    #     }
    #
    #     location /api/ {
    #         limit_req zone=api_addr burst=10 nodelay;
    #         proxy_pass http://backend:6970/;
    #         proxy_set_header X-Forwarded-For $remote_addr;
    #         proxy_set_header Host $host;
    #         proxy_http_version 1.1;
    #         proxy_connect_timeout 3s;
    #         proxy_read_timeout 5s;
    #     }
    #
    #     location / {
    #         return 301 https://www.tty.cards$request_uri;
    #     }
    # }
}
