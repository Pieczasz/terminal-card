events {
    worker_connections 1024;
}

stream {
    # Limit concurrent SSH connections per real client IP at the edge.
    # Backend RateLimitMiddleware still applies when clients bypass this proxy.
    limit_conn_zone $binary_remote_addr zone=ssh_addr:10m;

    server {
        listen 22 so_keepalive=on;
        limit_conn ssh_addr 8;
        proxy_pass backend:6969;
        # Forward the real client IP so the backend's per-IP rate limiter,
        # logs, and traces see the client, not this proxy.
        proxy_protocol on;
        proxy_timeout 1h;
        proxy_connect_timeout 1h;
    }
}

http {
    # This file replaces nginx's default conf wholesale, so the mime map it normally
    # provides has to be included by hand. Without it every static file is served as
    # application/octet-stream and browsers refuse to apply the stylesheet.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;

    # Public read-only stats feed for the website. Nothing here is authenticated and
    # nothing accepts writes, so the only thing worth defending is the cost of a
    # flood - hence the per-IP request zone below, on top of the backend's own limit.
    limit_req_zone $binary_remote_addr zone=api_addr:10m rate=2r/s;

    server_tokens off;

    server {
        listen 80;
        # TLS is not terminated here yet. Before this is public, add a 443 server
        # with certbot certificates and redirect 80 to it.

        location /api/ {
            limit_req zone=api_addr burst=10 nodelay;

            # The trailing slash on proxy_pass strips /api, so the backend keeps
            # serving its own /v1/... paths.
            proxy_pass http://backend:6970/;

            # API_TRUST_PROXY reads the leftmost entry of this header for its rate
            # limit, so it has to be set here and must not be forwarded from the
            # client. $remote_addr, not $proxy_add_x_forwarded_for: appending would
            # let a caller inject a leading address and take over the bucket.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_http_version 1.1;

            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # Serve the built marketing site if it is mounted. Harmless when absent:
        # nginx answers 404 and the deployment simply has no website on this host.
        location / {
            root /srv/site;
            index index.html;
            try_files $uri $uri/index.html $uri.html =404;

            # Hashed asset filenames are safe to cache hard; HTML is not.
            location ~* \.(css|js|woff2?|png|svg|ico)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
