server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

compactor:
  compaction:
    # 48 hours, and deliberately the shortest retention in the stack. A session span
    # carries the username (the client address was removed so the two never sit on
    # one record - see internal/observability/DATA.md), and traces are a debugging aid
    # for the last day or two; nothing here needs them longer, so nothing keeps them.
    block_retention: 48h

ingester:
  # Cut and flush blocks on a schedule rather than only on size, so the retention above
  # is measured from roughly when the trace happened. The default 30m leaves recent
  # traces sitting in memory, which is also the 384MiB this service is limited to.
  max_block_duration: 10m

overrides:
  defaults:
    global:
      # One runaway trace must not be able to spend the ingester's whole budget.
      max_bytes_per_trace: 5000000

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
