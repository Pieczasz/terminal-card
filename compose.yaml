# Cap every container's JSON log so stdout can't fill the host disk.
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrate:
    image: migrate/migrate:v4.18.3
    <<: *default-logging
    volumes:
      - ./internal/db/migrations:/migrations:ro
    # migrates scratch image has no shell, so the DSN must be passed as an arg.
    # Prefer an external migrate job / Docker secret in hardened deployments.
    command:
      [
        "-path=/migrations",
        "-database=postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-terminal_card}?sslmode=${DB_SSLMODE:-disable}",
        "up",
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: "on-failure"

  # Wish SSH backend. Do NOT add a host port: mapping for 6969 - PROXY protocol
  # trusts client headers from any peer; only the nginx proxy service may reach it.
  backend:
    restart: unless-stopped
    <<: *default-logging
    build:
      context: .
      dockerfile: cmd/server/Dockerfile
    environment:
      - ENV=production
      # Stamped onto service.version so dashboards can tell deploys apart; without
      # it every release reports the same constant.
      - SERVICE_VERSION=${SERVICE_VERSION:-dev}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=6969
      # Stats feed for the website. Reached only through the proxy's /api/ location -
      # deliberately never published to the host, which is also what makes it safe
      # for the backend to trust X-Forwarded-For for its rate limit.
      - API_PORT=6970
      - API_TRUST_PROXY=true
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_NAME=${DB_NAME:-terminal_card}
      - DB_PASSWORD=${DB_PASSWORD}
      # DB_SSLMODE defaults to "require" inside the binary. The DB container
      # is on the internal Docker network with no TLS configured, so we must
      # accept the plain connection here. Do NOT set this on a remote DB.
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - ALLOW_INSECURE_DB=${ALLOW_INSECURE_DB:-true}
      - SSH_KEY_PATH=/data/ssh/server
      - OTEL_EXPORTER_OTLP_ENDPOINT=alloy:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - RATE_LIMIT_CONNECTIONS=5
      - RATE_LIMIT_WINDOW_MS=1000
      - MAX_CONNECTIONS=1000
      # Rendering a frame costs ~4k allocations against a live heap of a few tens of
      # MB, so the default GOGC=100 collects constantly and GC, not the cores, becomes
      # the ceiling: measured on 6 cores, GOGC=400 renders 62% more frames a second
      # than the default, while on 2 cores it is worth ~4%. Raise this with the core
      # count, not the RAM.
      - GOGC=400
      # The backstop that makes the line above safe: collection is forced as the heap
      # approaches this, so a traffic spike cannot turn a relaxed GOGC into an OOM.
      # Keep it at roughly 75% of whatever mem_limit this service is given.
      # Measured (cmd/loadtest, menu journey): ~1MB per parked session. 1GiB sat
      # exactly at the limit with 1000 sessions; 1536MiB gives the advertised
      # MAX_CONNECTIONS=1000 real headroom. Raise both together before raising
      # MAX_CONNECTIONS.
      - GOMEMLIMIT=1536MiB
    # The hard ceiling GOMEMLIMIT is 75% of; the kernel kills past this, Go GC
    # holds well under it.
    mem_limit: 2g
    volumes:
      - ssh-keys:/data/ssh
    # A card server needs no privileges and writes nothing outside its volume.
    # The named mount above stays writable: read_only covers the image layer only,
    # which is what keygen needs for /data/ssh.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The distroless image has no shell; the server binary probes its own
      # stats API (-healthcheck -> GET /healthz, which pings the database).
      # Plain compose only *marks* a container unhealthy; pair with an
      # auto-restarter (or Docker Swarm) if unattended recovery matters.
      test: ["CMD", "/usr/local/bin/backend", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Longer than run's worst-case sequential drain (30s SSH Shutdown + 5s stats
    # API + 15s finalizers + a second 15s finalizer window + 5s OTel flush = 70s),
    # with headroom for the db close and final log writes, so a redeploy cannot
    # SIGKILL the process while a ranked match is still being persisted or
    # telemetry flushed.
    stop_grace_period: 80s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:16-alpine
    restart: always
    <<: *default-logging
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-terminal_card}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    <<: *default-logging
    volumes:
      - type: bind
        source: ./internal/config/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      # Built marketing site. Optional: nginx 404s if the directory is empty, so a
      # deployment that only wants the game works unchanged.
      - type: bind
        source: ./web/dist
        target: /srv/site
        read_only: true
    ports:
      - 22:22
      - 80:80
    depends_on:
      - backend

  # Observability stack (Alloy -> Loki/Tempo/Prometheus + Grafana).
  alloy:
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    mem_limit: 256m
    <<: *default-logging
    volumes:
      - ./internal/config/alloy/config.alloy:/etc/alloy/config.alloy
      # Read-only Docker socket so loki.source.docker can ship container
      # stdout/stderr (panic dumps and third-party logs) into Loki.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - loki
      - tempo
      - prometheus

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    mem_limit: 512m
    <<: *default-logging
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    mem_limit: 512m
    <<: *default-logging
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./internal/config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    expose:
      - 4317

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    mem_limit: 512m
    <<: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./internal/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./internal/config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    mem_limit: 256m
    <<: *default-logging
    volumes:
      - ./internal/config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./internal/config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./internal/config/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      # Anonymous access is intentionally disabled: Grafana is a private
      # operator dashboard reached only on loopback (127.0.0.1:3000). A password
      # is always required. Set GRAFANA_ADMIN_PASSWORD in the host environment or
      # a .env file; the default below is refused in production by the healthcheck.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
      - tempo
      - prometheus

volumes:
  db-data:
  ssh-keys:
  tempo-data:
  prometheus-data:
