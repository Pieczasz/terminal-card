services:
  backend:
    build:
      context: .
      dockerfile: cmd/server/Dockerfile
      target: builder
    secrets:
      - backend-password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:latest
    restart: always
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=terminal_card
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx
    volumes:
      - type: bind
        source: ./internal/config/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    ports:
      - 22:22
    depends_on:
      - backend

volumes:
  db-data:

secrets:
  db-password:
    file: internal/db/psql_password.txt
  backend-password:
    file: internal/db/psql_password.txt
