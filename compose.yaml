services:
  backend:
    build:
      context: .
      dockerfile: cmd/server/Dockerfile
      target: builder
    environment:
      - ENV=production
      - SERVER_PORT=6969
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_NAME=terminal_card
      - DB_PASSWORD_FILE=/run/secrets/backend-password
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
    secrets:
      - backend-password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:latest
    restart: always
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=terminal_card
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx
    volumes:
      - type: bind
        source: ./internal/config/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    ports:
      - 22:22
    depends_on:
      - backend

  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./internal/config/alloy/config.alloy:/etc/alloy/config.alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - loki

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./internal/config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"
    depends_on:
      - loki

volumes:
  db-data:

secrets:
  db-password:
    file: internal/db/psql_password.txt
  backend-password:
    file: internal/db/psql_password.txt
